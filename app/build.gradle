plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.plugin.compose' }

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }
def signingFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasSigningConfiguration = signingFields.every { releaseSigning.getProperty(it) }
def verifyProjectSigning = tasks.register('verifyProjectSigning') {
    doLast {
        if (!hasSigningConfiguration) throw new GradleException('Packaging requires the official keystore.properties; compilation, unit tests and lint do not. See docs/development.md.')
        if (!rootProject.file(releaseSigning.getProperty('storeFile')).isFile()) throw new GradleException('The configured official signing keystore does not exist.')
    }
}
// Every installable artifact requires the official key, including test APKs.
tasks.configureEach {
    if (name.startsWith('validateSigning') || name ==~ /(?:package|bundle|sign)(?:Debug|Release)(?:AndroidTest|Bundle)?/) dependsOn verifyProjectSigning
}

// Keep generated resources/classes out of cloud-sync conflict copies. The suffix is
// a normal directory on other platforms, and no machine-specific path is needed.
layout.buildDirectory.set(rootProject.layout.projectDirectory.dir('Cache/build-output.nosync/app'))

android {
    namespace 'io.github.flipcover.controls'
    compileSdk 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.github.flipcover.controls'
        minSdk 30
        targetSdk 36
        versionCode 75
        versionName '0.18.17'
        testInstrumentationRunner 'io.github.flipcover.controls.UiSmokeInstrumentation'
    }
    buildFeatures { aidl true; buildConfig true; compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (hasSigningConfiguration) {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.release }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant -> variant.enableUnitTest = true }
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

dependencies {
    implementation 'androidx.core:core:1.18.0'
    implementation 'io.github.kyant0:backdrop:2.0.1'
    implementation 'io.github.kyant0:shapes:1.2.1'
    implementation 'androidx.compose.foundation:foundation:1.12.0'
    implementation 'androidx.compose.ui:ui:1.12.0'
    implementation 'androidx.compose.animation:animation-core:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
    implementation 'androidx.savedstate:savedstate:1.3.3'
    compileOnly 'androidx.annotation:annotation:1.3.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'me.majiajie:tinypinyin:2.0.3'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}

// Frequently tuned parameters come from app-config.json; build identity, fixed
// contracts and internal implementation limits remain with their existing owners.
apply from: rootProject.file('gradle/app-config.gradle')
def appConfigFile = rootProject.layout.projectDirectory.file('app-config.json')
def appConfigAssets = layout.buildDirectory.dir('generated/app-config/assets')
def appConfigResources = layout.buildDirectory.dir('generated/app-config/res')
abstract class PrepareAppConfig extends DefaultTask {
    @OutputDirectory abstract org.gradle.api.file.DirectoryProperty getAssetsDirectory()
    @OutputDirectory abstract org.gradle.api.file.DirectoryProperty getResourcesDirectory()
}
def prepareAppConfig = tasks.register('prepareAppConfig', PrepareAppConfig) {
    assetsDirectory.set(appConfigAssets)
    resourcesDirectory.set(appConfigResources)
    inputs.file(appConfigFile)
    outputs.dir(appConfigAssets)
    outputs.dir(appConfigResources)
    doLast {
        def config = new groovy.json.JsonSlurper().parse(appConfigFile.asFile, 'UTF-8')
        if (config.schemaVersion != 1 || !(config.update instanceof Map)) throw new GradleException('Invalid app-config.json schema')
        def update = config.update
        def endpoint = new URI(update.catalogUrl as String)
        if (!(endpoint.scheme in ['https', 'http']) || !endpoint.host || endpoint.userInfo || endpoint.query || endpoint.fragment || !endpoint.path.endsWith('/catalog.json')) throw new GradleException('Invalid update.catalogUrl')
        ['connectTimeoutMs', 'readTimeoutMs', 'maxCatalogBytes', 'maxApkBytes', 'cacheRetentionHours'].each { key ->
            def value = update[key]
            if (!(value instanceof Number) || value.longValue() <= 0 || value.doubleValue() != value.longValue()) throw new GradleException("Invalid update.${key}")
        }
        if (!(update.maxRedirects instanceof Number) || update.maxRedirects < 0 || update.maxRedirects > 10 || update.maxRedirects.doubleValue() != update.maxRedirects.intValue()) throw new GradleException('Invalid update.maxRedirects')
        if (update.connectTimeoutMs > 120000 || update.readTimeoutMs > 120000 || update.maxCatalogBytes > 1048576 || update.maxApkBytes > 536870912 || update.cacheRetentionHours > 168) throw new GradleException('Update configuration exceeds supported bounds')
        copy { from appConfigFile; into appConfigAssets }
        def xml = appConfigResources.get().file('xml/update_network_security.xml').asFile
        xml.parentFile.mkdirs()
        def domain = endpoint.scheme == 'http' ? "<domain-config cleartextTrafficPermitted=\"true\"><domain includeSubdomains=\"false\">${endpoint.host}</domain></domain-config>" : ''
        xml.setText("<?xml version=\"1.0\" encoding=\"utf-8\"?><network-security-config><base-config cleartextTrafficPermitted=\"false\"/>${domain}</network-security-config>", 'UTF-8')
        def launcher = appConfigValues.appearance.launcher
        def dimensions = [launcher_panel_radius: launcher.panelRadiusDp, launcher_folder_radius: launcher.folderRadiusDp, launcher_dock_radius: launcher.dockRadiusDp]
        def sizes = appConfigResources.get().file('values/app_config.xml').asFile
        sizes.parentFile.mkdirs()
        sizes.setText('<resources>\n' + dimensions.collect { name, value -> "    <dimen name=\"${name}\">${value}dp</dimen>" }.join('\n') + '\n</resources>\n', 'UTF-8')
    }
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.sources.assets.addGeneratedSourceDirectory(prepareAppConfig) { it.assetsDirectory }
    variant.sources.res.addGeneratedSourceDirectory(prepareAppConfig) { it.resourcesDirectory }
}

tasks.register('prepareUpdateRelease', Exec) {
    dependsOn 'assembleRelease', 'testReleaseUnitTest', 'lintRelease'
    workingDir rootProject.projectDir
    environment 'ANDROID_HOME', androidComponents.sdkComponents.sdkDirectory.get().asFile.absolutePath
    environment 'JAVA_HOME', System.getProperty('java.home')
    environment 'PROJECT_RELEASE_CHECKED', '1'
    environment 'PROJECT_RELEASE_GRADLE', gradle.gradleVersion
    environment 'PROJECT_RELEASE_JAVA', System.getProperty('java.version')
    environment 'PROJECT_RELEASE_AGP', androidComponents.pluginVersion.toString()
    commandLine 'node', 'tools/project/release.mjs', 'prepare'
}
