def values = [:]
def flatten
flatten = { String prefix, Map section ->
    if (section.isEmpty()) throw new GradleException("Empty app-config section: ${prefix}")
    section.each { key, value ->
        def path = prefix ? "${prefix}.${key}" : key
        if (value instanceof Map) flatten(path, value)
        else values[path] = value
    }
}
if (!(config instanceof Map) || config.keySet() != ['schemaVersion', 'update', 'defaults', 'appearance', 'motion'].toSet() || !(config.schemaVersion instanceof Integer) || config.schemaVersion != 1) throw new GradleException('Invalid app-config.json schema')
['defaults', 'appearance', 'motion'].each { section ->
    if (!(config[section] instanceof Map)) throw new GradleException("Missing app-config section: ${section}")
    flatten(section, config[section])
}
if (values.keySet() != parameters.keySet()) throw new GradleException("Invalid app-config fields; missing: ${parameters.keySet() - values.keySet()}, unknown: ${values.keySet() - parameters.keySet()}")
parameters.each { path, rule ->
    def value = values[path], type = rule[0]
    boolean valid
    switch (type) {
        case 'boolean': valid = value instanceof Boolean; break
        case 'String': valid = value instanceof String && !value.isEmpty() && (rule.size() == 1 || value in rule[1]); break
        case 'String[]': valid = value instanceof List && value.size() <= 30 && value.toSet().size() == value.size() && value.every { it instanceof String && it ==~ /[a-z][a-z0-9_]*/ }; break
        default: valid = value instanceof Number && value >= rule[1] && value <= rule[2] && (type != 'int' || value.doubleValue() == value.intValue())
    }
    if (!valid) throw new GradleException("Invalid app-config value: ${path}")
    def name = path.replaceAll(/([A-Z]+)([A-Z][a-z])/, '$1_$2').replaceAll(/([a-z0-9])([A-Z])/, '$1_$2').replace('.', '_').toUpperCase(Locale.ROOT)
    def literal = type == 'String[]' ? '{' + value.collect { groovy.json.JsonOutput.toJson(it) }.join(', ') + '}' : type == 'String' ? groovy.json.JsonOutput.toJson(value) : value.toString() + (type == 'float' ? 'f' : '')
    android.defaultConfig.buildConfigField(type, name, literal)
}
def launcher = config.appearance.launcher
['defaults.dock.actions', 'defaults.dock.favorites', 'defaults.controlCenter.actions'].each { path ->
    if (!values[path].every { it in builtInActions }) throw new GradleException("Unknown built-in default action: ${path}")
}
if (!(config.defaults.dock.pinnedAction in builtInActions)) throw new GradleException('Unknown defaults.dock.pinnedAction')
if (launcher.railIconDp > launcher.railWidthDp || launcher.railFramePaddingDp * 2 >= launcher.railWidthDp || launcher.folderMemberIconDp > launcher.folderMemberHeightDp || launcher.dockIconDp > launcher.dockRowDp || launcher.dockAppsIconDp > launcher.dockRowDp || launcher.dockClearIconDp > launcher.dockRowDp) throw new GradleException('app-config launcher icons/padding do not fit their surfaces')
if (config.appearance.glass.softBlurDp > config.appearance.glass.strongBlurDp) throw new GradleException('app-config soft blur exceeds strong blur')
ext.appConfigValues = config
