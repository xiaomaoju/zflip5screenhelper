name: Deploy prototype previews

on:
  push:
    branches: [main]
    paths:
      - 'dist/device-frames/**'
      - 'dist/html/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          site=Cache/build-output.nosync/pages
          mkdir -p "$site/device-frames"
          cp dist/html/*.html dist/html/zflip5-cover-overlay.svg dist/html/zflip5-cover-overlay.png dist/html/zflip5-cover-overlay@2x.png "$site/"
          # Keep the previously published frame download URLs available.
          cp dist/html/zflip5-cover-overlay.svg dist/html/zflip5-cover-overlay.png dist/html/zflip5-cover-overlay@2x.png "$site/device-frames/"
          cat > "$site/device-frames/preview.html" <<'HTML'
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../device-frame-preview.html"><title>设备外框预览</title><a href="../device-frame-preview.html">打开设备外框预览</a></html>
          HTML
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: Cache/build-output.nosync/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
