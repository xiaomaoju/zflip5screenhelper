name: Deploy prototype previews

on:
  push:
    branches: [main]
    paths:
      - 'dist/**/*.html'
      - 'dist/device-frames/**'
      - 'dist/HTML-PROTOTYPE.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          site=Cache/build-output.nosync/pages
          mkdir -p "$site/device-frames"
          cp dist/index.html dist/flipcover-prototype.html dist/settings-oneui-prototype.html dist/HTML-PROTOTYPE.md "$site/"
          cp dist/device-frames/preview.html dist/device-frames/zflip5-cover-overlay.svg dist/device-frames/zflip5-cover-overlay.png dist/device-frames/zflip5-cover-overlay@2x.png "$site/device-frames/"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: Cache/build-output.nosync/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
