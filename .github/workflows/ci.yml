name: Project checks, Pages and APK release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository:
    name: Repository (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check repository and portable website
        run: node tools/project/check.mjs
      - name: Test project tooling
        run: node --test tools/project/project.test.mjs
      - name: Assemble website
        if: runner.os == 'Linux'
        run: node tools/project/site.mjs assemble Cache/build-output.nosync/project/pages
      - name: Upload checked website
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: Cache/build-output.nosync/project/pages

  android:
    name: Android compile, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902' # 22.0, supports SDK repository schema 4
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK versions declared by Gradle
        shell: bash
        run: |
          mkdir -p Cache/build-output.nosync/project
          node tools/project/check.mjs sdk-packages > Cache/build-output.nosync/project/sdk-packages.txt
          mapfile -t packages < Cache/build-output.nosync/project/sdk-packages.txt
          sdkmanager "${packages[@]}"
      - name: Check Android without signing credentials
        run: ./gradlew --no-daemon :app:compileDebugJavaWithJavac :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:testReleaseUnitTest :app:lintRelease
      - name: Retain test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_id }}
          path: Cache/build-output.nosync/app/reports/
          if-no-files-found: warn
          retention-days: 14

  pages:
    name: Deploy checked website
    needs: [repository, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy exact checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  package:
    name: Build signed APK
    needs: [repository, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    outputs:
      versionCode: ${{ steps.identity.outputs.versionCode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate new version and main ancestry
        id: identity
        run: node tools/project/cloud-release.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install declared SDK
        shell: bash
        run: |
          mkdir -p Cache/build-output.nosync/project
          node tools/project/check.mjs sdk-packages > Cache/build-output.nosync/project/sdk-packages.txt
          mapfile -t packages < Cache/build-output.nosync/project/sdk-packages.txt
          sdkmanager "${packages[@]}"
      - name: Restore official signing for this job
        run: node tools/project/signing.mjs create
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Build, test, lint and prepare verified APK
        run: ./gradlew --no-daemon :app:prepareUpdateRelease
      - name: Remove temporary signing files
        if: always()
        run: node tools/project/signing.mjs remove
      - name: Upload only complete public delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apk-${{ github.run_id }}
          path: dist/update-release/${{ steps.identity.outputs.versionCode }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified APK prerelease
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install declared verification tools
        shell: bash
        run: |
          mkdir -p Cache/build-output.nosync/project
          node tools/project/check.mjs sdk-packages > Cache/build-output.nosync/project/sdk-packages.txt
          mapfile -t packages < Cache/build-output.nosync/project/sdk-packages.txt
          sdkmanager "${packages[@]}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apk-${{ github.run_id }}
          path: dist/update-release/${{ needs.package.outputs.versionCode }}/
      - name: Verify transferred APK and publish exact assets
        run: node tools/project/cloud-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
