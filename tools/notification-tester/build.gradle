plugins { id 'com.android.application' version '9.1.1' }

layout.buildDirectory.set(layout.projectDirectory.dir('../../Cache/build-output.nosync/notification-tester'))

android {
    namespace 'io.github.flipcover.notificationtester'
    compileSdk 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.github.flipcover.notificationtester'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
